name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 6 hours. The venue posts a few times a week, so this is ample;
    # GitHub cron is best-effort and often runs 5-20 min late anyway.
    - cron: '17 */6 * * *'

permissions:
  contents: write   # the ingest step commits refreshed event data
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Shallow: the wget mirror is gitignored at HEAD but still sits in
          # older commits (~101 MB). Depth 1 avoids ever fetching it.
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Ingest events from Facebook
        # Only on scheduled/manual runs - a plain push should not silently
        # rewrite event data. The script is a no-op if the fetch or parse
        # fails, so a Facebook change can never break the build.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 tools/ingest-facebook.py

      - name: Commit refreshed event data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- src/_data/events.json content/flyers; then
            echo "no event changes to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/_data/events.json content/flyers
          git commit -m "Refresh events from Facebook [skip ci]"
          git push

      - name: Cache generated images
        # eleventy-img skips work when the output file already exists, so
        # restoring _site/img turns a ~50s cold build into a fast one.
        uses: actions/cache@v4
        with:
          path: _site/img
          key: eleventy-img-${{ hashFiles('content/flyers/**', 'content/team/**') }}
          restore-keys: eleventy-img-

      - name: Resolve base URL
        id: base
        run: |
          # Set repo variable CUSTOM_DOMAIN (e.g. braindead.live) to deploy at
          # a domain root. Without it, build for the project-page subpath.
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then
            echo "path_prefix=" >> "$GITHUB_OUTPUT"
            echo "Deploying to custom domain: ${{ vars.CUSTOM_DOMAIN }}"
          else
            echo "path_prefix=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_OUTPUT"
            echo "Deploying to project page: /${GITHUB_REPOSITORY#*/}"
          fi

      - name: Build
        env:
          PATH_PREFIX: ${{ steps.base.outputs.path_prefix }}
        run: npm run build

      - name: Write CNAME
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > _site/CNAME

      - name: Disable Jekyll
        # Pages ignores files starting with "_" unless this exists.
        run: touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
