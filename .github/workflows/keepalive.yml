name: Keepalive

# GitHub disables scheduled workflows after 60 days of repository inactivity.
# Between shows this repo can easily sit idle that long, which would silently
# stop the event ingest. A monthly commit resets that clock.
on:
  schedule:
    - cron: '23 5 1 * *'   # 05:23 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Touch heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git diff --staged --quiet || git commit -m "Keepalive: keep scheduled workflows enabled [skip ci]"
          git push
